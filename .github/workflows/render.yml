name: Render Cartoon From Release Zip

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag that contains public.zip. Leave empty to use the latest release."
        required: false
        default: ""
      asset_name:
        description: "Name of the ZIP asset uploaded to the release."
        required: true
        default: "public.zip"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download public assets from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail

          mkdir -p _release_assets _unzipped

          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir _release_assets --clobber
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir _release_assets --clobber
          fi

          ZIP_PATH="$(find _release_assets -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP_PATH" ]; then
            echo "Could not find a ZIP release asset named $ASSET_NAME"
            exit 1
          fi

          rm -rf public
          mkdir -p public
          unzip -q "$ZIP_PATH" -d _unzipped

          if [ -d _unzipped/public ]; then
            cp -R _unzipped/public/. public/
          else
            cp -R _unzipped/. public/
          fi

          test -f public/scenes.json
          test -d public/images
          test -d public/audio

      - name: Check project
        run: npm run lint

      - name: Render video
        run: npm run render

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-explainer-video
          path: renders/cartoon-explainer.mp4
          if-no-files-found: error
