name: Render Cartoon From Release Zip

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag that contains one or more zip assets. Leave empty to use the latest release."
        required: false
        default: ""
        type: string
      asset_name:
        description: "ZIP asset name or pattern. Use *.zip to render all zip assets in the release."
        required: true
        default: "public.zip"
        type: string
      num_workers:
        description: "Parallel chunk workers per video"
        required: true
        default: "2"
        type: string
      max_parallel_jobs:
        description: "Maximum total render jobs to run at once"
        required: true
        default: "10"
        type: string
      composition:
        description: "Remotion composition ID"
        required: true
        default: "CartoonExplainer"
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      render_matrix: ${{ steps.build.outputs.render_matrix }}
      videos_matrix: ${{ steps.build.outputs.videos_matrix }}

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Discover zip assets and build render matrices
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          NUM_WORKERS: ${{ inputs.num_workers }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p .tmp/assets .tmp/extract

          if [ -n "$RELEASE_TAG" ]; then
            gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets > release.json
          else
            gh release view --repo "$REPOSITORY" --json assets > release.json
          fi

          python3 <<'PY'
          import fnmatch, json, math, os, re, subprocess, sys
          from pathlib import Path

          with open('release.json', 'r', encoding='utf-8') as f:
              release = json.load(f)

          asset_pattern = os.environ.get('ASSET_NAME', '*.zip') or '*.zip'
          num_workers = max(1, int(os.environ['NUM_WORKERS']))
          gh_token = os.environ['GH_TOKEN']

          assets = []
          for asset in release.get('assets', []):
              name = asset.get('name', '')
              if not name.lower().endswith('.zip'):
                  continue
              if asset_pattern in ('*.zip', '*') or fnmatch.fnmatch(name, asset_pattern):
                  assets.append(asset)

          if not assets:
              sys.exit(f"❌ No matching .zip assets found for pattern: {asset_pattern}")

          videos = []
          render_jobs = []
          used_ids = set()

          def find_scenes_path(extract_dir: Path) -> Path:
              candidates = [
                  extract_dir / 'scenes.json',
                  extract_dir / 'public' / 'scenes.json',
              ]
              for candidate in candidates:
                  if candidate.exists():
                      return candidate
              matches = list(extract_dir.rglob('scenes.json'))
              if matches:
                  return matches[0]
              return extract_dir / 'scenes.json'

          for asset in assets:
              asset_name = asset['name']
              zip_url = asset['url']
              base_id = re.sub(r'[^A-Za-z0-9._-]+', '-', Path(asset_name).stem).strip('-').lower() or 'video'
              video_id = base_id
              suffix = 2
              while video_id in used_ids:
                  video_id = f"{base_id}-{suffix}"
                  suffix += 1
              used_ids.add(video_id)

              local_zip = Path('.tmp/assets') / f'{video_id}.zip'
              extract_dir = Path('.tmp/extract') / video_id
              extract_dir.mkdir(parents=True, exist_ok=True)

              subprocess.run([
                  'curl', '-sSL',
                  '-H', f'Authorization: Bearer {gh_token}',
                  '-H', 'Accept: application/octet-stream',
                  '-o', str(local_zip),
                  zip_url,
              ], check=True)

              subprocess.run(['unzip', '-o', str(local_zip), '-d', str(extract_dir)], check=True, stdout=subprocess.DEVNULL)

              scenes_path = find_scenes_path(extract_dir)
              if not scenes_path.exists():
                  sys.exit(f"❌ {asset_name} does not contain scenes.json")

              with scenes_path.open('r', encoding='utf-8') as sf:
                  scenes = json.load(sf)

              duration = scenes.get('duration')
              if duration is None:
                  # fallback: use the highest end time from scene/caption data if duration is not present
                  possible_ends = []
                  for key in ('scenes', 'captions'):
                      for item in scenes.get(key, []) if isinstance(scenes.get(key), list) else []:
                          for end_key in ('end', 'endTime', 'to'):
                              if end_key in item:
                                  possible_ends.append(float(item[end_key]))
                  if not possible_ends:
                      sys.exit(f"❌ {asset_name} -> scenes.json has no duration field and no usable end times")
                  duration = max(possible_ends)

              total_frames = math.ceil(float(duration) * 25)
              frames_per_worker = max(1, (total_frames + num_workers - 1) // num_workers)

              videos.append({
                  'video_id': video_id,
                  'zip_name': asset_name,
                  'zip_url': zip_url,
                  'total_frames': total_frames,
              })

              for idx in range(num_workers):
                  start = idx * frames_per_worker
                  end = min(((idx + 1) * frames_per_worker) - 1, total_frames - 1)
                  if start >= total_frames:
                      break
                  render_jobs.append({
                      'video_id': video_id,
                      'zip_name': asset_name,
                      'zip_url': zip_url,
                      'index': idx,
                      'start': start,
                      'end': end,
                  })

          print(f"Found {len(videos)} zip file(s) and built {len(render_jobs)} render job(s).")

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"render_matrix={json.dumps(render_jobs, separators=(',', ':'))}\n")
              out.write(f"videos_matrix={json.dumps(videos, separators=(',', ':'))}\n")
          PY

  render:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel_jobs) }}
      matrix:
        chunk: ${{ fromJson(needs.setup.outputs.render_matrix) }}

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Chrome
        run: npx remotion browser ensure

      - name: Download assets for ${{ matrix.chunk.zip_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf public _unzipped assets.zip
          mkdir -p public _unzipped

          curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o assets.zip \
            "${{ matrix.chunk.zip_url }}"

          unzip -q assets.zip -d _unzipped

          if [ -d _unzipped/public ]; then
            cp -R _unzipped/public/. public/
          else
            cp -R _unzipped/. public/
          fi

          test -f public/scenes.json
          test -d public/images
          test -d public/audio

      - name: Render ${{ matrix.chunk.video_id }} chunk ${{ matrix.chunk.index }}
        run: |
          set -euo pipefail
          OUT_FILE="chunk_${{ matrix.chunk.video_id }}_${{ matrix.chunk.index }}.mp4"

          npx remotion render ${{ inputs.composition }} "$OUT_FILE" \
            --frames=${{ matrix.chunk.start }}-${{ matrix.chunk.end }} \
            --concurrency=2 \
            --image-format=jpeg \
            --video-bitrate=8M \
            --codec=h264 \
            --overwrite

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.video_id }}-${{ matrix.chunk.index }}
          path: chunk_${{ matrix.chunk.video_id }}_${{ matrix.chunk.index }}.mp4
          retention-days: 1

  stitch:
    needs: [setup, render]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        video: ${{ fromJson(needs.setup.outputs.videos_matrix) }}

    steps:
      - name: Download chunks for ${{ matrix.video.video_id }}
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-${{ matrix.video.video_id }}-*
          path: chunks/

      - name: Stitch ${{ matrix.video.video_id }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          find chunks -name "*.mp4" | sort -V > chunk_files.txt

          if [ ! -s chunk_files.txt ]; then
            echo "❌ No chunk files found for ${{ matrix.video.video_id }}"
            exit 1
          fi

          rm -f list.txt
          while IFS= read -r f; do
            echo "file '$(pwd)/$f'" >> list.txt
          done < chunk_files.txt

          ffmpeg -y -f concat -safe 0 -i list.txt -c copy "${{ matrix.video.video_id }}.mp4"

      - name: Upload final video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.video.video_id }}
          path: ${{ matrix.video.video_id }}.mp4
          retention-days: 7
